<div 
    class="bg-white rounded-lg shadow-md overflow-hidden transition-all duration-300 hover:shadow-lg h-[200px] cursor-pointer" 
    
    [routerLink]="['/new-world/company', company.id]" 

    [ngClass]="{
        'border-l-4': true,
        'border-[#ecc94b]': company.faction === 'covenant',
        'border-[#48bb78]': company.faction === 'marauder',
        'border-[#9f7aea]': company.faction === 'syndicate'
    }">
    
    <div class="flex flex-col h-full p-6">
        <div class="flex items-start justify-between mb-4">
            <div>
                <h3 class="text-xl font-semibold text-gray-900">{{ company.name }}</h3>
                <p class="text-sm text-gray-500">{{ company.server }}</p>
            </div>
            <div class="text-right">
                <p class="text-sm text-gray-500">{{ company.memberCount }}/100 members</p>
            </div>
        </div>

        <div class="flex-grow">
            @if (company.territories) {
                <div class="inline-block px-3 py-1 mb-4 bg-gray-100 rounded-full">
                    <span class="text-sm text-gray-700">{{ company.territories }}</span>
                </div>
            }
        </div>

        <div class="pt-4 border-t border-gray-200">
            <div class="flex justify-between text-sm">
                <div>
                    <p class="text-gray-600">Governor</p>
                    <p class="font-medium text-gray-900">{{ company.governor }}</p>
                </div>
                <div class="text-right">
                    <p class="text-gray-600">Consul</p>
                    <p class="font-medium text-gray-900">{{ company.consul }}</p>
                </div>
            </div>
        </div>
    </div>
</div>
