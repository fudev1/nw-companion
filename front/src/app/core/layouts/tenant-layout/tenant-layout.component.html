
<div 
    class="min-h-screen bg-slate-500"
    [ngClass]="{
        'theme-covenant': company?.faction === 'covenant',
        'theme-marauder': company?.faction === 'marauder',
        'theme-syndicate': company?.faction === 'syndicate'
    }">
    

    <app-tenant-nav [company]="company" />

    <main class="container px-4 py-8 mx-auto">
        <router-outlet></router-outlet>
    </main>
    
</div>
