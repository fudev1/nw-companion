<nav class="bg-white shadow-lg">
    <div class="container px-4 mx-auto">

        <!-- Left Section -->
        <div class="flex items-center justify-between h-16">
            <!-- Logo -->
            <div class="flex justify-between">
                <div class="flex items-center pr-5 logo">
                    <a href="/" class="text-xl font-bold logo-link">GM</a>
                </div>
    
                <div class="flex items-center pr-5 sublogo">
                    <a routerLink="/new-world" class="p-2 text-white bg-teal-700 rounded">New World</a>
                    <!-- <span class="p-2 text-white bg-teal-700 rounded">New World</span> -->
                </div>

                <span 
                    class="flex items-center mx-4 text-xl font-bold"
                    [ngClass]="{
                        'text-[#ecc94b]': company?.faction === 'covenant',
                        'text-[#48bb78]': company?.faction === 'marauder',
                        'text-[#9f7aea]': company?.faction === 'syndicate'
                    }">
                    {{ company?.name }}
                </span>

                <!-- Main Navigation -->
                <div class="items-center hidden space-x-4 md:flex navigation">
                    
                    @for (item of navItems; track item.path) {
                        <a [routerLink]="item.path" routerLinkActive="text-blue-800" class="px-3 py-2 text-sm font-medium text-gray-700 rounded-md hover:text-gray-900 hover:bg-gray-100">
                            {{ item.label }}
                        </a>
                    }

                </div>

            </div>
  
            <!-- Right Navigation -->
            <div class="flex items-center space-x-4">
                <button 
                    class="px-4 py-2 text-white rounded-md hover:bg-opacity-90"
                    [ngClass]="{
                        'bg-[#ecc94b]': company?.faction === 'covenant',
                        'bg-[#48bb78]': company?.faction === 'marauder',
                        'bg-[#9f7aea]': company?.faction === 'syndicate'
                    }"
                    routerLink="/new-world/company/{{ company?.id }}/apply"
                >
                APPLY
                </button>
                <app-user-menu></app-user-menu>
            </div>
        </div>


    </div>
    


</nav>
